[package]
name = "notebase-ffi"
description = "UniFFI bindings: drive an notebase vault from Swift, Kotlin or Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "notebase_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
notebase.workspace = true
notebase-store.workspace = true
notebase-sync = { workspace = true, features = ["store"] }
thiserror.workspace = true
serde_json = "1"
uniffi = { version = "0.32", features = ["cli"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
