[package]
name = "notebase-sync"
description = "Version-vector sync for notebase notes: missing updates, chunked, resumable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
notebase.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
bincode = "1"

[features]
default = []
store = ["dep:notebase-store"]

[dependencies.notebase-store]
workspace = true
optional = true

[dev-dependencies]
notebase-store.workspace = true
base64 = "0.22"

[[example]]
name = "sync-peer"
required-features = ["store"]

[example.dependencies]
base64 = "0.22"
